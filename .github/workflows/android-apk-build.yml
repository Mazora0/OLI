name: Qalvero Android APK Builder

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Qalvero queue job id
        required: true
        type: string
      source_mode:
        description: repository or zip_url
        required: true
        default: repository
        type: choice
        options:
          - repository
          - zip_url
      source_zip_url:
        description: Signed source ZIP URL for zip_url mode
        required: false
        type: string
      android_project_dir:
        description: Android or Capacitor project directory
        required: false
        default: .
        type: string
      gradle_task:
        description: Gradle task, for example assembleDebug
        required: false
        default: assembleDebug
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: qlo-apk-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository source
        if: inputs.source_mode == 'repository'
        uses: actions/checkout@v4

      - name: Download ZIP source
        if: inputs.source_mode == 'zip_url'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "${{ inputs.source_zip_url }}" -o source.zip
          unzip -q source.zip -d source-workdir
          shopt -s dotglob nullglob
          items=(source-workdir/*)
          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
            cp -a "${items[0]}"/. .
          else
            cp -a source-workdir/. .
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies and sync Capacitor
        shell: bash
        working-directory: ${{ inputs.android_project_dir }}
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
            npm run build || true
            if [ -d android ] && ls capacitor.config.* >/dev/null 2>&1; then
              npx cap sync android
            fi
          fi

      - name: Build Android package
        shell: bash
        working-directory: ${{ inputs.android_project_dir }}
        run: |
          set -euo pipefail
          if [ -d android ]; then
            cd android
          fi
          if [ ! -f ./gradlew ]; then
            echo "No gradlew found. Expected an Android Gradle project or Capacitor android directory."
            exit 10
          fi
          chmod +x ./gradlew
          ./gradlew ${{ inputs.gradle_task }} --stacktrace
          cd "$GITHUB_WORKSPACE"
          mkdir -p qlo-apk-output
          apk="$(find "${{ inputs.android_project_dir }}" -path "*/build/outputs/apk/*.apk" -type f | head -n 1 || true)"
          aab="$(find "${{ inputs.android_project_dir }}" -path "*/build/outputs/bundle/*.aab" -type f | head -n 1 || true)"
          if [ -n "$apk" ]; then
            cp "$apk" "qlo-apk-output/${{ inputs.job_id }}.apk"
          elif [ -n "$aab" ]; then
            cp "$aab" "qlo-apk-output/${{ inputs.job_id }}.aab"
          else
            echo "No APK/AAB artifact found."
            exit 11
          fi

      - name: Upload Android artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qalvero-apk-${{ inputs.job_id }}
          path: qlo-apk-output/*
          if-no-files-found: ignore
          retention-days: 14
